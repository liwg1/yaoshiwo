<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面不存在 · 钥匙窝 YaoShiWo</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .nf { min-height: 72vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 0; }
    .nf-code { font-size: clamp(72px, 16vw, 132px); font-weight: 800; line-height: 1; letter-spacing: -2px;
      background: linear-gradient(96deg, var(--cyan-2) 0%, var(--indigo-2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { margin-top: 18px; font-size: clamp(20px, 3vw, 26px); }
    .nf p { margin-top: 14px; max-width: 560px; color: var(--text-2); line-height: 1.85; font-size: 15px; }
    .nf-actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .nf-actions a { padding: 11px 22px; border-radius: 11px; font-size: 14.5px; font-weight: 700; }
    .nf-actions .primary { color: #05101f; background: linear-gradient(120deg, var(--cyan), var(--indigo)); }
    .nf-actions .ghost { color: var(--text); border: 1px solid var(--line); }
    .nf-actions .ghost:hover { border-color: rgba(56, 189, 248, 0.45); color: var(--cyan-2); }
  </style>
</head>
<body>
  <main class="container nf">
    <div class="nf-code">404</div>
    <h1>这个页面不存在</h1>
    <p>可能是链接输错了，或者我们改过页面地址。密码管理器本体没事 —— 你的数据一直在自己电脑上。</p>
    <div class="nf-actions">
      <a class="primary" href="/">回到首页</a>
      <a class="ghost" href="/#download">下载钥匙窝</a>
      <a class="ghost" href="https://github.com/liwg1/yaoshiwo" target="_blank" rel="noopener noreferrer">源码在 GitHub</a>
    </div>
  </main>
</body>
</html>
