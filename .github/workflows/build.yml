name: 构建 Windows 安装包

# 手动触发，或打 tag（如 v1.2.0）时自动构建，并把安装包作为工作流产物留存。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 打包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: node node_modules/typescript/lib/tsc.js --noEmit

      - name: 打包（NSIS 安装版 + 免安装版）
        run: npm run package:win

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: YaoShiWo-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
