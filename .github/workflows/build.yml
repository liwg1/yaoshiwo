name: 构建 Windows 安装包

# 手动触发，或打 tag（如 v1.2.0）时自动构建，并把安装包作为工作流产物留存。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 打包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: node node_modules/typescript/lib/tsc.js --noEmit

      - name: 打包（NSIS 安装版 + 免安装版）
        # --publish never：打 tag 触发时 electron-builder 会默认去「发布到 GitHub Release」，
        # 没有 GH_TOKEN 就直接报 "GitHub Personal Access Token is not set" 失败。
        # 安装包由这里作为工作流产物留存，Release 附件另行上传。
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 计算校验值
        shell: bash
        run: |
          cd release
          sha256sum YaoShiWo-Setup-*.exe YaoShiWo-portable.exe | tee SHA256SUMS.txt

      - name: 发布 Release（仅打 tag 时执行）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/github-release-${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then echo "::error::缺少发布说明 $NOTES"; exit 1; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，改为覆盖上传附件"
            gh release upload "$GITHUB_REF_NAME" release/*.exe release/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "钥匙窝 YaoShiWo ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              release/*.exe release/SHA256SUMS.txt
          fi
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "\(.name)  \(.size) 字节"'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: YaoShiWo-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
