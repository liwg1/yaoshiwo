<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; overflow: hidden; }
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif; background: #0b1220; position: relative; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(320px 220px at 12% -8%, rgba(56,189,248,.24), transparent 64%),
      radial-gradient(300px 220px at 96% 108%, rgba(99,102,241,.32), transparent 66%),
      linear-gradient(140deg, #0a1020 0%, #101a34 48%, #0b1428 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .18;
    background-image:
      linear-gradient(rgba(148,197,255,.26) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,197,255,.26) 1px, transparent 1px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(260px 260px at 50% 42%, #000 0%, transparent 80%);
    mask-image: radial-gradient(260px 260px at 50% 42%, #000 0%, transparent 80%);
  }
  .wrap {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
  }
  .logo {
    width: 92px; height: 92px; border-radius: 25px; display: grid; place-items: center;
    background: linear-gradient(145deg, #38bdf8, #6366f1);
    box-shadow: 0 16px 40px rgba(56,189,248,.38), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .logo svg { width: 52px; height: 52px; }
  .name { font-size: 38px; font-weight: 800; color: #eef4ff; letter-spacing: .5px; margin-top: 2px; }
  .pill {
    font-size: 17px; font-weight: 700; padding: 8px 20px; border-radius: 999px;
    background: rgba(56,189,248,.13); border: 1px solid rgba(56,189,248,.5); color: #7dd3fc;
    letter-spacing: .8px;
  }
  .line { font-size: 15px; font-weight: 700; color: #fde68a; letter-spacing: .6px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2.2l7.2 3.4v5.9c0 4.6-3.1 8.7-7.2 10.9-4.1-2.2-7.2-6.3-7.2-10.9V5.6L12 2.2z" fill="#fff"/>
        <path d="M8.6 12.1l2.3 2.3 4.5-4.6" stroke="#1b2a4a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="name">钥匙窝</div>
    <div class="pill">v1.2.0 更新</div>
    <div class="line">4 处改动 · 更顺手</div>
  </div>
</body>
</html>
